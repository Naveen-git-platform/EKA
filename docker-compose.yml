# Enterprise Knowledge Agent - full stack: Qdrant + FastAPI backend + Streamlit frontend.
#
#   cp .env.example .env        # add GROQ_API_KEY (or set LLM_PROVIDER=fake for a keyless offline demo)
#   docker compose up --build
#   UI: http://localhost:8501   API docs: http://localhost:8000/docs
name: eka

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # the Qdrant image ships without curl/wget; probe the TCP port with bash instead
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
    ports:
      - "8000:8000"
    volumes:
      - eka_data:/data
    depends_on:
      qdrant:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  qdrant_data:
  eka_data:
