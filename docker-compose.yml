# Enterprise Knowledge Agent - full stack: Qdrant + FastAPI backend + Next.js web.
#
#   cp backend/.env.example backend/.env   # add GROQ_API_KEY (or set LLM_PROVIDER=fake for a keyless offline demo)
#   docker compose up --build
#   UI: http://localhost:3000   API docs: http://localhost:8000/docs
name: eka

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # the Qdrant image ships without curl/wget; probe the TCP port with bash instead
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
    ports:
      - "8000:8000"
    volumes:
      - eka_data:/data
    depends_on:
      qdrant:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Must be reachable from the *browser*, not from inside the compose network.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  qdrant_data:
  eka_data:
